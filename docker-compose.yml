version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bams
      POSTGRES_USER: bams_user
      POSTGRES_PASSWORD: securepass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://bams_user:securepass@postgres:5432/bams
      JWT_SECRET: super_secure_jwt_secret_here
      JWT_EXPIRES_IN: 1h
      REFRESH_TOKEN_EXPIRES_IN: 7d
      ENCRYPTION_KEY: replace_with_32_byte_base64_or_raw_secret
      S3_BUCKET: bams-reports
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: YOUR_ACCESS_KEY
      AWS_SECRET_ACCESS_KEY: YOUR_SECRET_KEY
      FRONTEND_URL: http://localhost:8000
      PORT: 4000
    depends_on:
      - postgres

volumes:
  postgres-data:
